name: CI

on:
  push:
    branches: [bleeding, m0-bootstrap]
  pull_request:
    branches: [bleeding]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-smoke:
    name: Linux A32 smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLIBA32ANDROID_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  android-arm64-build:
    name: Android arm64-v8a cross-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libboost-dev
      - name: Install pinned NDK
        run: sdkmanager "ndk;27.2.12479018"
      - name: Configure arm64-v8a
        run: >-
          cmake -S . -B build-android -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-26
          -DBoost_INCLUDE_DIR=/usr/include
          -DLIBA32ANDROID_BUILD_TESTS=OFF
          -DDYNARMIC_ENABLE_NO_EXECUTE_SUPPORT=ON
      - name: Build shared runtime
        run: cmake --build build-android --target liba32android --parallel 2
