  "the generic A32 execution seam optionally stops before executing a caller-selected logical guest PC and reports whether that stop was reached",
  "stop-PC termination detects both initial-PC and post-instruction arrival, does not require the stop address to be mapped, and preserves existing fixed-instruction behavior when unused",
  "a lifecycle executor consumes a verified INIT_ARRAY call plan in order, derives ARM versus Thumb from each raw function value, and invokes every call with a caller-owned 8-byte-aligned guest stack top",
  "each constructor invocation is independently bounded by a caller-selected instruction ceiling and uses the stop-PC seam for return detection without executable sentinel code",
  "CPU exception, memory fault, invalid function alignment/options, and instruction-budget exhaustion fail explicitly with call/object provenance and no claim that later calls ran",
  "constructor guest-memory side effects from completed calls are preserved; the executor itself does not map/protect/unmap memory or persist constructor-called state",
  "legacy DT_INIT, DT_PREINIT_ARRAY, FINI_ARRAY/destructor execution, recursion state persisted across calls, process argv/envp, dlopen lifecycle, unload, and Android namespace/provider policy remain outside this feature",
  "exact-head Linux A32 smoke and both required Android checks pass before the feature is closed"
]

