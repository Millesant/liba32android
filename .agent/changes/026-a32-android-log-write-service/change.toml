acceptance = [
  "Android-specific host-service behavior lives under src/compat rather than cpu/runtime/elf and depends only on generic runtime/memory contracts",
  "the bridge models int __android_log_write(int prio, const char* tag, const char* text) using AAPCS32 r0/r1/r2 inputs and writes the signed 32-bit sink result bit-for-bit to r0",
  "the service uses one caller-selected exact SVC immediate; mismatched SVC IDs remain Unhandled",
  "tag and text are copied only through GuestMemory under independent caller-provided maximum payload lengths with exact-limit NUL termination accepted",
  "a zero tag pointer is preserved as a null tag for the sink; zero text, unreadable memory, logical-address overflow, or missing NUL within the ceiling fails before sink invocation",
  "the caller-owned sink receives byte-preserving synchronous views and owns host logging/filter/return policy; the bridge does not link to host liblog",
  "runtime coverage proves ARM SVC -> feature-025 registry -> feature-024 dispatcher -> log-write service composition, signed return bits, null tag, exact string limits, wrong service ID, null text, unreadable and unterminated failure cases",
  "no guest ELF liblog.so provider/shim, Android namespace/search policy, __android_log_print/__android_log_vprint varargs handling, JNI, graphics, audio, or general libc emulation is introduced",
  "exact-head Linux A32 smoke and both required Android checks pass before the feature is closed"
]

