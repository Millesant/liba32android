acceptance = [
  "a caller-owned ordered provider chain implements Elf32DependencyProvider without changing the existing resolver/loader APIs",
  "providers are tried strictly in caller order and fallback continues only when a provider returns NotFound",
  "provider Failed and successful results stop the chain immediately and are returned unchanged",
  "requester identity, requested dependency bytes, and the exact max-image ceiling are forwarded unchanged to every attempted provider",
  "an empty chain returns NotFound; a null provider entry fails explicitly instead of being skipped",
  "the chain owns no provider and stores only a borrowed finite provider list whose storage must outlive the chain",
  "the generic chain performs no pathname normalization, namespace accessibility, APK lookup, platform catalog selection, preload/RTLD policy, or result identity rewriting",
  "focused tests cover success short-circuit, NotFound fallback, hard failure, requester-aware forwarding, legacy child providers, empty/null entries, and unchanged resolver validation",
  "exact-head Linux A32 smoke and both required Android checks pass before the feature is closed"
]

