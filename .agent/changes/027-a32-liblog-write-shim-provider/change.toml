acceptance = [
  "one shared compatibility header defines the private ARM32 Android log-write shim SVC immediate as 0xA0 for both guest assembly and host C++ code",
  "a reproducible freestanding ARMv7 Android DSO with SONAME liblog.so exports __android_log_write as an ARM function that executes only the private SVC then bx lr",
  "a reproducible freestanding ARMv7 consumer declares exactly the liblog.so dependency required to call __android_log_write through the ordinary PLT path",
  "make_a32_android_log_shim_catalog_entry produces an exact-name borrowed catalog entry for liblog.so with stable opaque identity and no image ownership transfer",
  "integration loading forms a two-object consumer/shim graph through Elf32DependencyCatalogProvider and resolves __android_log_write from the shim object",
  "the consumer JUMP_SLOT relocation is applied through the existing combined relocation path and targets the shim symbol",
  "executing the real consumer crosses shim SVC -> feature-025 registry -> feature-026 log service, preserves AAPCS arguments, returns the sink result, and reaches the requested stop PC",
  "fixture generation is deterministic under the pinned NDK and CI inspects SONAME, DT_NEEDED, exported symbol, and R_ARM_JUMP_SLOT evidence",
  "no print/vprint varargs, automatic platform catalog installation, namespace/search policy, host liblog dependency, JNI/graphics/audio behavior, or general application compatibility is introduced",
  "exact-head Linux A32 smoke and both required Android checks pass before the feature is closed"
]

