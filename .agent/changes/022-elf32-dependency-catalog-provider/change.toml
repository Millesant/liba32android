acceptance = [
  "a caller-owned exact-name catalog implements Elf32DependencyProvider without changing resolver/loader APIs",
  "catalog entries borrow requested-name bytes, provider identity bytes, and image bytes; the catalog provider itself owns none of them",
  "lookup compares requested dependency bytes exactly with no normalization, basename matching, path rewriting, UTF-8 assumptions, or requester interpretation",
  "a unique exact match returns an owned identity/image copy independent of catalog backing storage",
  "no exact match returns NotFound; multiple exact-name matches fail explicitly rather than picking one",
  "a matching entry with empty identity, empty image, or image bytes above the supplied ceiling fails before publishing a successful source",
  "the provider composes through feature 021 so an application catalog can fall through on NotFound to a platform catalog while resolver validation/resource semantics remain unchanged",
  "catalog/request/image bytes containing embedded NUL or non-UTF8 values are preserved byte-for-byte",
  "Android filesystem search, APK ZIP access, namespace accessibility, RUNPATH/RPATH, LD_LIBRARY_PATH, preload/RTLD policy, platform allowlists, and compatibility shims remain outside this feature",
  "exact-head Linux A32 smoke and both required Android checks pass before the feature is closed"
]

