acceptance = [
  "a new game-agnostic runtime layer sits above cpu::execute and memory::GuestMemory; Dynarmic types and Android API policy remain outside it",
  "a caller-owned host-service handler receives the exact SVC immediate plus mutable guest registers/CPSR and GuestMemory, and returns Handled, Unhandled, or Failed",
  "execute_a32_with_services applies one caller-selected total instruction budget across all CPU resumptions and a separate finite maximum handled-service count",
  "handled SVC traps resume from the post-SVC logical PC/register/CPSR state returned by feature 023 while preserving the original stop-PC target",
  "memory faults and non-SVC CPU exceptions fail explicitly; unhandled/failed services and service-limit exhaustion are distinct errors with failing SVC provenance",
  "when a stop PC is requested, exhausting the total instruction budget before reaching it fails explicitly; without a stop PC, ordinary fixed-budget completion remains successful",
  "completed handler register/memory side effects are preserved if a later service or CPU step fails; the dispatcher performs no rollback or mapping lifecycle",
  "ARM and Thumb synthetic service programs prove resume, return-to-stop, exact service IDs, handler register/memory effects, service ceilings, failure short-circuit, CPU faults, and fixed-budget compatibility",
  "no service registry, Android API implementation, AAPCS stack marshalling, libc/JNI/graphics/audio behavior, shim ELF generation, syscall ABI, or namespace/search policy is introduced",
  "exact-head Linux A32 smoke and both required Android checks pass before the feature is closed"
]

