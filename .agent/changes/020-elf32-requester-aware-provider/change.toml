  "dependency resolution can carry a borrowed requester identity alongside each exact DT_NEEDED request without changing provider-result ownership",
  "Elf32DependencyProvider exposes an additive requester-aware hook whose default implementation delegates to the existing context-free resolve method so existing providers remain source-compatible",
  "the recursive one-shot and persistent link-map loaders pass the exact currently loading graph-object identity for root and nested dependency requests",
  "requester identity bytes are forwarded unchanged and remain valid only for the synchronous provider call; no borrowed view is persisted",
  "dependency count/image-byte ceilings, NotFound/Failed translation, ordered/repeated occurrence handling, and all-or-nothing resolver output remain unchanged",
  "provider result identity remains the opaque loaded-object key and is not reinterpreted as a pathname, SONAME, or namespace identifier",
  "Android filesystem paths, namespace accessibility, linked namespaces, RUNPATH/RPATH, LD_LIBRARY_PATH, preload/RTLD policy, APK ZIP lookup, and platform shim selection remain outside this feature",
  "exact-head Linux A32 smoke and both required Android checks pass before the feature is closed"
